spring.application.name=Neeramoy Backend
spring.config.import=optional:file:.env[.properties],optional:file:backend/Neeramoy Backend/.env[.properties]




spring.mongodb.uri=${MONGODB_URI}

server.port=8888
server.address=0.0.0.0

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Security / JWT properties
neeramoy.jwt.secret=${JWT_SECRET:8f7b764a781b0f55cf6fc393967d3e6962bb5f82c448bb0c00a68d06d48b1111}
neeramoy.jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# Cloudinary properties
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Development Admin Provisioning (Local dev only, disabled by default)
app.dev.admin.enabled=${DEV_ADMIN_ENABLED:${ADMIN_SEED_ENABLED:false}}
app.dev.admin.email=${DEV_ADMIN_EMAIL:${ADMIN_SEED_EMAIL:}}
app.dev.admin.password=${DEV_ADMIN_PASSWORD:${ADMIN_SEED_PASSWORD:}}
app.dev.admin.name=${DEV_ADMIN_NAME:${ADMIN_SEED_NAME:Admin User}}
app.dev.admin.phone=${DEV_ADMIN_PHONE:${ADMIN_SEED_PHONE:01700000000}}

