spring.application.name=Neeramoy Backend
spring.config.import=optional:file:.env[.properties],optional:file:backend/Neeramoy Backend/.env[.properties]

# MongoDB Atlas configuration
spring.data.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI:}}
spring.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI:}}

# Server port configuration (Render PORT environment variable with 10000 fallback)
server.port=${PORT:10000}
server.address=0.0.0.0

# CORS allowed origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5175,http://localhost:3000,http://localhost:5173,https://neeramoy.netlify.app}

# Multipart upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=25MB

# Security / JWT properties
neeramoy.jwt.secret=${JWT_SECRET:8f7b764a781b0f55cf6fc393967d3e6962bb5f82c448bb0c00a68d06d48b1111}
neeramoy.jwt.expirationMs=${JWT_EXPIRATION_MS:86400000}

# Cloudinary properties
cloudinary.url=${CLOUDINARY_URL:}
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Payment gateway settings (SSLCommerz)
payment.sslcommerz.store-id=${SSLCOMMERZ_STORE_ID:}
payment.sslcommerz.store-password=${SSLCOMMERZ_STORE_PASSWORD:}
payment.sslcommerz.is-sandbox=${SSLCOMMERZ_IS_SANDBOX:true}
payment.sslcommerz.api-url=${SSLCOMMERZ_API_URL:https://sandbox.sslcommerz.com}
payment.sslcommerz.success-url=${SSLCOMMERZ_SUCCESS_URL:}
payment.sslcommerz.fail-url=${SSLCOMMERZ_FAIL_URL:}
payment.sslcommerz.cancel-url=${SSLCOMMERZ_CANCEL_URL:}
payment.sslcommerz.ipn-url=${SSLCOMMERZ_IPN_URL:}
app.frontend-url=${FRONTEND_BASE_URL:https://neeramoy.netlify.app}

# Development Admin Provisioning (Local dev only, disabled by default)
app.dev.admin.enabled=${DEV_ADMIN_ENABLED:${ADMIN_SEED_ENABLED:false}}
app.dev.admin.email=${DEV_ADMIN_EMAIL:${ADMIN_SEED_EMAIL:}}
app.dev.admin.password=${DEV_ADMIN_PASSWORD:${ADMIN_SEED_PASSWORD:}}
app.dev.admin.name=${DEV_ADMIN_NAME:${ADMIN_SEED_NAME:Admin User}}
app.dev.admin.phone=${DEV_ADMIN_PHONE:${ADMIN_SEED_PHONE:01700000000}}

